<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN reader</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 0; padding: 12px; }
  button { padding: 10px 16px; font-size: 15px; margin: 0 6px 6px 0; }
  #warn { margin-top: 8px; font: bold 13px ui-monospace, monospace; color: #e5484d; white-space: pre-wrap; }
  pre { margin: 8px 0; font: 12px ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
  details { margin: 6px 0; }
  summary { padding: 6px 0; font-size: 15px; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; font: 13px ui-monospace, monospace; width: 100%; }
  th, td { padding: 3px 6px; text-align: left; border-bottom: 1px solid #8884; white-space: nowrap; }
  td.n { text-align: right; }
  .b { display: inline-block; width: 2.2ch; text-align: center; transition: background-color 1s linear; }
  .b.hot { background-color: #e8b400; color: #000; transition: none; }
</style>
</head>
<body>
<button id="btn">Connect</button>
<div id="warn"></div>
<pre id="info">Not connected.</pre>
<details id="logbox">
  <summary>Event log</summary>
  <button id="copy">Copy log</button><button id="clear">Clear</button>
  <pre id="log"></pre>
</details>
<div class="wrap">
  <table>
    <thead><tr><th>ID</th><th>Count</th><th>ms</th><th>Data</th></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>

<script>
const $ = (id) => document.getElementById(id);
const btn = $('btn'), info = $('info'), warn = $('warn'), body = $('body');
const logEl = $('log'), logBox = $('logbox');
const H = Array.from({ length: 256 }, (_, i) => i.toString(16).toUpperCase().padStart(2, '0'));

const rows = new Map(), dirty = new Set(), hot = new Map(), prevs = {};
let needSort = false;
let total = 0, lastTotal = 0, bad = 0, bytes = 0, lastBytes = 0;
let fMark = null, totalMark = 0, lost = 0, lostAcc = 0;
let t0 = null, endT = null, lastT = 0, minFps = Infinity;
let lastByteT = 0, lastFrameT = 0, noData = false, noFrames = false;
let st = {}, lastUp = -1, reboots = 0, dev = '', badLines = [];
let paintMax = 0, paintRunMax = 0, lagMs = 0, lagRunMax = 0;
let idsEarly = 0, earlyDone = false;
let status = 'Not connected.', port = null, reader = null, busy = false, wake = null;

// ---- event log, kept across page reloads ----
let logArr = [], logDirty = false;
try { logArr = JSON.parse(localStorage.getItem('canreader.log') || '[]'); } catch (e) {}
function ev(m) {
  logArr.push(new Date().toTimeString().slice(0, 8) + '  ' + m);
  if (logArr.length > 300) logArr.shift();
  logDirty = true;
}
ev('--- page loaded ---');
setInterval(() => {
  if (!logDirty) return;
  try { localStorage.setItem('canreader.log', JSON.stringify(logArr.slice(-200))); } catch (e) {}
  logDirty = false;
}, 3000);
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(logArr.join('\n')); ev('log copied'); }
  catch (e) { logEl.textContent = logArr.join('\n'); ev('copy failed, showing full log'); }
};
$('clear').onclick = () => { logArr = []; logDirty = true; logEl.textContent = ''; };
window.addEventListener('error', (e) => ev('js error ' + e.message));
window.addEventListener('unhandledrejection', (e) => ev('js rejection ' + (e.reason && e.reason.message || e.reason)));
document.addEventListener('visibilitychange', () => {
  ev(document.hidden ? 'page hidden' : 'page visible');
  if (!document.hidden && reader) getWake();
});
document.addEventListener('freeze', () => ev('page frozen by browser'));
document.addEventListener('resume', () => ev('page resumed'));

async function getWake() {
  if (!('wakeLock' in navigator) || wake) return;
  try {
    wake = await navigator.wakeLock.request('screen');
    ev('wake lock on');
    wake.addEventListener('release', () => { wake = null; ev('wake lock released'); });
  } catch (e) { ev('wake lock failed ' + (e.name || e)); }
}

// ---- parsing ----
function onStat(s) {
  const o = {};
  for (const kv of s.slice(7).split(' ')) {
    const i = kv.indexOf('=');
    if (i > 0) o[kv.slice(0, i)] = kv.slice(i + 1);
  }
  const f = Number(o.frames), up = Number(o.up);
  if (!isNaN(up)) {
    if (lastUp >= 0 && up < lastUp) {   // device restarted without the USB link dropping
      reboots++;
      ev('device restarted, reset ' + o.rst);
      lostAcc += lost; fMark = null; lost = 0;
    }
    lastUp = up;
  }
  if (!isNaN(f)) {
    if (fMark === null) { fMark = f; totalMark = total; lost = 0; }
    else lost = (f - fMark) - (total - totalMark);   // sent since mark minus counted since mark
  }
  const prev = st;
  st = o;
  if (prev.up === undefined) ev('device ' + o.rate + ' reset ' + o.rst);
  else for (const k of ['state', 'rate', 'buserr', 'missed', 'recov', 'usbdrop', 'ringdrop']) {
    if (prev[k] !== o[k]) ev('dev ' + k + ' ' + prev[k] + ' to ' + o[k]);
  }
  if (Number(o.maxgap) > 50000) ev('dev loop gap ' + (o.maxgap / 1000).toFixed(0) + ' ms');
}

function onLine(s) {
  s = s.trim();
  if (!s) return;
  if (s[0] === '#') {
    if (s.startsWith('# stat ')) onStat(s);
    else { dev = s; ev('dev ' + s.slice(2)); }
    return;
  }
  const p = s.split(',');
  const fail = () => { bad++; badLines.push(s.slice(0, 40)); if (badLines.length > 3) badLines.shift(); };
  if (p.length !== 5) { fail(); return; }
  const ts = Number(p[0]), id = parseInt(p[1], 16), ext = p[2];
  const dlc = Number(p[3]), hex = p[4];
  if (isNaN(ts) || isNaN(id) || (ext !== '0' && ext !== '1') ||
      !(dlc >= 0 && dlc <= 8) || hex.length !== dlc * 2 || /[^0-9A-F]/.test(hex)) {
    fail(); return;
  }
  const key = ext + ':' + id;
  let r = rows.get(key);
  if (!r) {
    r = { id, ext, count: 0, ts: 0, period: 0, dlc: 0, bytes: [], chg: [], tr: null, c: null };
    rows.set(key, r);
    needSort = true;
    if (performance.now() - t0 < 5000) idsEarly++;
    else ev('new id ' + p[1]);
  }
  r.count++;
  if (r.ts) r.period = (ts - r.ts) / 1000;
  r.ts = ts;
  r.dlc = dlc;
  for (let i = 0; i < dlc; i++) {
    const v = parseInt(hex.substr(i * 2, 2), 16);
    if (r.bytes[i] !== undefined && r.bytes[i] !== v) r.chg[i] = true;
    r.bytes[i] = v;
  }
  r.bytes.length = dlc;
  dirty.add(r);
  total++;
  lastFrameT = performance.now();
}

// ---- drawing ----
function makeRow(r) {
  const tr = document.createElement('tr');
  const mk = (txt, cls) => { const td = document.createElement('td'); if (cls) td.className = cls; td.textContent = txt; tr.appendChild(td); return td; };
  mk(r.id.toString(16).toUpperCase().padStart(r.ext === '1' ? 8 : 3, '0'));   // 8 digits = 29-bit, 3 = 11-bit
  const count = mk('', 'n');
  const period = mk('', 'n');
  const data = mk('');
  const spans = [];
  for (let i = 0; i < 8; i++) {
    const sp = document.createElement('span');
    sp.className = 'b';
    sp._t = '';
    data.appendChild(sp);
    spans.push(sp);
  }
  r.tr = tr;
  r.c = { count, period, spans };
}

function paint() {
  const a = performance.now();
  if (needSort) {
    for (const r of rows.values()) if (!r.tr) makeRow(r);
    const all = [...rows.values()].sort((x, y) => x.ext - y.ext || x.id - y.id);
    for (const r of all) body.appendChild(r.tr);
    needSort = false;
  }
  for (const r of dirty) {
    r.c.count.textContent = r.count;
    r.c.period.textContent = r.period ? r.period.toFixed(1) : '';
    for (let i = 0; i < 8; i++) {
      const sp = r.c.spans[i];
      const txt = i < r.dlc ? H[r.bytes[i]] : '';
      if (sp._t !== txt) { sp.textContent = txt; sp._t = txt; }
      if (r.chg[i]) {
        r.chg[i] = false;
        if (!sp.classList.contains('hot')) sp.classList.add('hot');
        hot.set(sp, a + 150);
      }
    }
  }
  dirty.clear();
  for (const [sp, until] of hot) {
    if (a >= until) { sp.classList.remove('hot'); hot.delete(sp); }
  }
  const d = performance.now() - a;
  if (d > paintMax) paintMax = d;
  if (d > paintRunMax) paintRunMax = d;
  requestAnimationFrame(paint);
}

// ---- once-per-second stats and event detection ----
const mmss = (sec) => String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
const kb = (v) => v === undefined ? '-' : (Number(v) / 1024).toFixed(0) + 'k';
function delta(k, cur, label) {
  const p = prevs[k];
  prevs[k] = cur;
  if (p !== undefined && cur > p) ev(label + ' +' + (cur - p));
}

setInterval(() => {
  if (logBox.open) logEl.textContent = logArr.slice(-15).join('\n');
  if (t0 === null) { info.textContent = status; return; }
  const t = performance.now();
  const live = endT === null;
  const el = Math.max(((live ? t : endT) - t0) / 1000, 0.001);
  const dt = Math.max((t - lastT) / 1000, 0.001);
  const fps = (total - lastTotal) / dt;
  const kbs = (bytes - lastBytes) / 1024 / dt;
  lagMs = Math.max(0, dt * 1000 - 1000);
  if (live && lagMs > lagRunMax) lagRunMax = lagMs;
  lastT = t; lastTotal = total; lastBytes = bytes;
  if (live && el > 2) minFps = Math.min(minFps, fps);

  const lostAll = lostAcc + lost;
  const sent = total + lostAll;
  const pct = fMark !== null && sent > 0 ? (lostAll / sent * 100).toFixed(3) : '-';

  if (live) {
    if (lagMs > 300) ev('stall ' + lagMs.toFixed(0) + ' ms' + (document.hidden ? ' (page hidden)' : ''));
    const gb = t - lastByteT, gf = t - lastFrameT;
    if (gb > 3000 && !noData) { noData = true; ev('no usb data for 3 s'); }
    if (gb < 3000 && noData) { noData = false; ev('usb data resumed'); }
    if (gf > 3000 && gb < 3000 && !noFrames) { noFrames = true; ev('no frames for 3 s (bus quiet or wrong bitrate)'); }
    if (gf < 3000 && noFrames) { noFrames = false; ev('frames resumed'); }
    if (!earlyDone && el > 5) { earlyDone = true; ev(idsEarly + ' ids seen in first 5 s'); }
    delta('lost', lostAll, 'lost');
    delta('bad', bad, 'malformed' + (badLines.length ? ' e.g. ' + badLines[badLines.length - 1] : ''));
  }

  const L = [];
  L.push(status + '   run ' + mmss(el));
  L.push('frames/s now ' + (live ? fps.toFixed(0) : '-') + ' avg ' + (total / el).toFixed(0) +
         ' min ' + (minFps === Infinity ? '-' : minFps.toFixed(0)));
  L.push('KB/s now ' + (live ? kbs.toFixed(1) : '-') + ' avg ' + (bytes / 1024 / el).toFixed(1));
  L.push('total ' + total + '  ids ' + rows.size + '  malformed ' + bad);
  L.push('lost ' + (fMark === null && lostAcc === 0 ? '-' : lostAll) + ' (' + pct + '%)');
  if (st.up !== undefined) {
    L.push('dev up ' + st.up + 's ' + st.rate + ' ' + st.state);
    L.push('tec ' + st.tec + ' rec ' + st.rec + ' buserr ' + st.buserr);
    L.push('missed ' + st.missed + ' recov ' + st.recov + ' rxq ' + st.rxq);
    L.push('ring peak ' + st.peakfill + ' drop ' + st.ringdrop + '  usbdrop ' + st.usbdrop);
    L.push('heap ' + kb(st.heap) + ' min ' + kb(st.minheap) + '  loop gap max ' + (st.maxgap / 1000).toFixed(1) + 'ms');
    L.push('reset ' + st.rst + '  reboots seen ' + reboots);
  }
  L.push('paint ' + paintMax.toFixed(1) + 'ms (run max ' + paintRunMax.toFixed(1) + ')');
  L.push('tick lag ' + lagMs.toFixed(0) + 'ms (run max ' + lagRunMax.toFixed(0) + ')');
  L.push('wake lock ' + (wake ? 'on' : 'off') +
         (performance.memory ? '  js heap ' + (performance.memory.usedJSHeapSize / 1048576).toFixed(0) + 'M' : ''));
  if (badLines.length) L.push('bad lines ' + badLines.join(' | '));
  if (dev) L.push(dev);
  info.textContent = L.join('\n');
  paintMax = 0;

  const w = [];
  if (live && noData) w.push('NO USB DATA');
  else if (live && noFrames) w.push('No frames. Bus quiet or wrong bitrate.');
  if (reboots) w.push('Device restarted ' + reboots + 'x');
  warn.textContent = w.join('\n');
}, 1000);

// ---- connection ----
async function connect(p) {
  if (busy) return;
  if (!('serial' in navigator)) { status = 'Web Serial is not available in this browser.'; return; }
  busy = true;
  try {
    port = p || await navigator.serial.requestPort();
    await port.open({ baudRate: 2000000, bufferSize: 65536 });
  } catch (e) {
    status = 'Could not open port. ' + e.message;
    ev('open failed ' + e.message);
    port = null; busy = false;
    return;
  }

  // fresh run, reset everything
  rows.clear(); dirty.clear(); hot.clear(); body.innerHTML = '';
  total = lastTotal = bad = bytes = lastBytes = 0;
  fMark = null; totalMark = 0; lost = 0; lostAcc = 0;
  st = {}; lastUp = -1; reboots = 0; dev = ''; badLines = [];
  paintMax = 0; paintRunMax = 0; lagMs = 0; lagRunMax = 0;
  for (const k in prevs) delete prevs[k];
  noData = noFrames = false; idsEarly = 0; earlyDone = false;
  t0 = performance.now(); lastT = t0; endT = null; minFps = Infinity;
  lastByteT = t0; lastFrameT = t0;

  let usb = '';
  try { const i = port.getInfo(); usb = ' vid ' + (i.usbVendorId || 0).toString(16) + ' pid ' + (i.usbProductId || 0).toString(16); } catch (e) {}
  ev('connected' + (p ? ' (auto)' : '') + usb);
  status = 'Connected.';
  btn.textContent = 'Disconnect';
  getWake();

  const dec = new TextDecoder();
  let buf = '', first = true, why = 'closed';
  reader = port.readable.getReader();
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      lastByteT = performance.now();
      bytes += value.length;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i);
        buf = buf.slice(i + 1);
        if (first) { first = false; continue; }   // first piece may be a cut-off line
        onLine(line);
      }
      if (buf.length > 1000) buf = '';
    }
  } catch (e) {
    why = e.message;
    status = 'Read error. ' + e.message;
  } finally {
    endT = performance.now();
    try { reader.releaseLock(); await port.close(); } catch (e) {}
    reader = null; port = null; busy = false;
    btn.textContent = 'Connect';
    if (status === 'Connected.') status = 'Disconnected.';
    ev('disconnected ' + why);
    if (wake) wake.release();
  }
}

async function tryAuto() {
  if (busy || !('serial' in navigator)) return;
  try {
    const ps = await navigator.serial.getPorts();
    ev('auto-connect, granted ports ' + ps.length);
    if (ps.length) await connect(ps[0]);
  } catch (e) { ev('auto-connect failed ' + (e.message || e)); }
}
if ('serial' in navigator) {
  navigator.serial.addEventListener('connect', () => { ev('usb device attached'); tryAuto(); });
  navigator.serial.addEventListener('disconnect', () => ev('usb device detached'));
  tryAuto();
}
btn.onclick = () => { if (reader) reader.cancel(); else connect(); };

requestAnimationFrame(paint);
</script>
</body>
</html>
