<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN reader</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 0; padding: 12px; }
  button, input { padding: 9px 12px; font-size: 15px; margin: 0 6px 6px 0; }
  input { width: 100%; box-sizing: border-box; margin: 0 0 6px; }
  #warn { margin-top: 8px; font: bold 13px ui-monospace, monospace; color: #e5484d; white-space: pre-wrap; }
  pre { margin: 8px 0; font: 12px ui-monospace, monospace; white-space: pre-wrap; word-break: break-all; }
  details { margin: 6px 0; }
  summary { padding: 6px 0; font-size: 15px; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; font: 13px ui-monospace, monospace; width: 100%; }
  th, td { padding: 3px 6px; text-align: left; border-bottom: 1px solid #8884; white-space: nowrap; }
  th { cursor: pointer; }
  td.n { text-align: right; }
  td.b { text-align: center; min-width: 2.4ch; transition: background-color 1s linear; }
  td.b.hot { background-color: #e8b400; color: #000; transition: none; }
  td.b.muted { color: #888; background-color: #8883; }
</style>
</head>
<body>
<button id="btn">Connect</button>
<div id="warn"></div>
<pre id="info">Not connected.</pre>
<details>
  <summary>Columns</summary>
  <input id="cname" placeholder="column name, for example rpm">
  <input id="cid" placeholder="row ID in hex, blank for all rows">
  <input id="cf" placeholder="formula, for example be(b2, b3) * 2">
  <button id="cadd">Save</button><span id="cmsg"></span>
  <pre>Names b0..b7 id dlc ext count period [column]. Helpers hex dec bin bit field be le signed map round abs min max none. An empty formula removes the cell, or the whole column if the row ID is blank too.</pre>
  <pre id="clist"></pre>
</details>
<details id="logbox">
  <summary>Event log</summary>
  <button id="copy">Copy log</button><button id="clear">Clear</button>
  <pre id="log"></pre>
</details>
<div class="wrap">
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
