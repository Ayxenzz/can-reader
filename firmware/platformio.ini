[platformio]
default_envs = car

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:car]
build_flags = ${env.build_flags} -DTEST_LOOPBACK=0

[env:loopback]
build_flags = ${env.build_flags} -DTEST_LOOPBACK=1