name: firmware
on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -e car -e scanner -e loopback
        working-directory: firmware
      - name: Merge images
        working-directory: firmware
        run: |
          for e in car scanner loopback; do
            python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32s3 merge_bin \
              -o merged-$e.bin --flash_mode qio --flash_freq 80m --flash_size 16MB \
              0x0 .pio/build/$e/bootloader.bin \
              0x8000 .pio/build/$e/partitions.bin \
              0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
              0x10000 .pio/build/$e/firmware.bin
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/merged-*.bin